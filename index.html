      {

          "串聯整份投影片的所有內容，最核心的學習目標是什麼？",
          "【課程總覽】從認識羊群效應到建立四大防禦方法，這份內容最希望幫助我們做到什麼？"
        ],
        correct: "克服羊群效應與情緒干擾，做出理性穩健決策。",
        distractors: [
          "學會如何在股市中預測每一次的最高點與最低點。",
          "在股災發生時最快速度跟隨群眾賣出所有資產。",
          "把投資當作逛街搶購，看到熱門就立刻跟進。"
        ],
        explanation: "整份內容旨在幫助我們看清羊群效應與情緒陷阱，並透過計劃、過濾噪音、反向思考與定期定額做出理性決策。"
      }
    ];

    const MODE_INFO = [
      {
        label: "模式一：核心觀念與真實情境推演",
        desc: "以投影片核心觀念與生活、股市情境為主，檢驗對基本概念與案例的理解。"
      },
      {
        label: "模式二：反向思考與錯誤行為診斷",
        desc: "改以反向提問、診斷錯誤操作與排除盲點的角度出題，測試觀念是否真的內化。"
      },
      {
        label: "模式三：案例拆解、策略對比與心法應用",
        desc: "著重於策略比較、案例啟示與實務應用情境，訓練在市場波動時做出獨立判斷。"
      }
    ];

    // 應用程式狀態
    const state = {
      round: 1,
      modeIndex: 0,
      filter: "all",
      answers: {}, // { questionId: selectedOptionText }
      shuffledOptions: {} // { questionId: [opt1, opt2, opt3, opt4] }
    };

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function prepareOptionsForRound() {
      state.shuffledOptions = {};
      QUESTION_BANK.forEach((q) => {
        const allOpts = [q.correct, ...q.distractors];
        state.shuffledOptions[q.id] = shuffleArray(allOpts);
      });
    }

    function retakeQuiz(nextModeIndex = null) {
      state.round += 1;
      state.answers = {};
      state.filter = "all";
      if (nextModeIndex !== null) {
        state.modeIndex = nextModeIndex;
      } else {
        state.modeIndex = (state.modeIndex + 1) % MODE_INFO.length;
      }
      document.getElementById("modeSelect").value = String(state.modeIndex);
      document.getElementById("summaryCard").classList.add("hidden");
      prepareOptionsForRound();
      updateFilterButtonsUI();
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectAnswer(questionId, optionText) {
      // 允許重新選擇答案
      state.answers[questionId] = optionText;
      renderSingleQuestion(questionId);
      updateStats();
    }

    function getStats() {
      const total = QUESTION_BANK.length;
      let answered = 0;
      let correct = 0;
      QUESTION_BANK.forEach((q) => {
        const chosen = state.answers[q.id];
        if (chosen !== undefined) {
          answered += 1;
          if (chosen === q.correct) {
            correct += 1;
          }
        }
      });
      return { total, answered, correct };
    }

    function updateStats() {
      const { total, answered, correct } = getStats();
      document.getElementById("roundBadge").textContent = `第 ${state.round} 輪測驗`;
      document.getElementById("modeBadge").textContent = `問法模式：${MODE_INFO[state.modeIndex].label}`;
      document.getElementById("modeDescription").textContent = MODE_INFO[state.modeIndex].desc;
      document.getElementById("answeredCount").textContent = `${answered} / ${total}`;
      document.getElementById("correctCount").textContent = String(correct);

      const pct = Math.round((answered / total) * 100);
      document.getElementById("progressBar").style.width = `${pct}%`;

      if (answered === total) {
        showSummary(true);
      }
    }

    function showSummary(autoTriggered = false) {
      const { total, answered, correct } = getStats();
      const rate = answered > 0 ? Math.round((correct / answered) * 100) : 0;
      const summaryCard = document.getElementById("summaryCard");
      const titleEl = document.getElementById("summaryTitle");
      const msgEl = document.getElementById("summaryMessage");

      if (answered === total) {
        titleEl.textContent = `第 ${state.round} 輪完成！答對 ${correct} / ${total} 題（正確率 ${rate}%）`;
        msgEl.textContent =
          rate >= 90
            ? "表現非常出色！你已經把防範羊群效應與股災理性決策的觀念掌握得相當扎實，歡迎點選重新測驗換新問法再挑戰！"
            : "很棒的練習！你可以檢視答錯題目的解析，或直接點擊「重新作答並換新問法」再測驗一次。";
      } else {
        titleEl.textContent = `目前進度：已作答 ${answered} / ${total} 題，答對 ${correct} 題（已答正確率 ${rate}%）`;
        msgEl.textContent = autoTriggered
          ? "繼續完成剩餘題目吧！"
          : "隨時可以繼續作答，或點擊右側按鈕清空紀錄並切換不同問法重新開始。";
      }

      summaryCard.classList.remove("hidden");
      if (!autoTriggered) {
        summaryCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    function buildQuestionCard(q, index) {
      const promptText = q.prompts[state.modeIndex] || q.prompts[0];
      const userAnswer = state.answers[q.id];
      const hasAnswered = userAnswer !== undefined;
      const isCorrect = hasAnswered && userAnswer === q.correct;
      const options = state.shuffledOptions[q.id] || [q.correct, ...q.distractors];

      const card = document.createElement("article");
      card.id = `q-card-${q.id}`;
      card.className =
        "rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 p-4 sm:p-6 shadow-sm space-y-4";

      // 題目頂部標籤
      const header = document.createElement("div");
      header.className = "flex flex-wrap items-center justify-between gap-2";

      const leftMeta = document.createElement("div");
      leftMeta.className = "flex items-center gap-2";

      const numBadge = document.createElement("span");
      numBadge.className =
        "inline-flex items-center justify-center px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-100 text-amber-900 dark:bg-amber-900/50 dark:text-amber-200";
      numBadge.textContent = `第 ${index + 1} 題`;

      const topicBadge = document.createElement("span");
      topicBadge.className =
        "inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300";
      topicBadge.textContent = q.topic;

      leftMeta.appendChild(numBadge);
      leftMeta.appendChild(topicBadge);

      const statusBadge = document.createElement("span");
      if (!hasAnswered) {
        statusBadge.className = "text-xs font-medium text-slate-400 dark:text-slate-500";
        statusBadge.textContent = "尚未作答";
      } else if (isCorrect) {
        statusBadge.className =
          "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300";
        statusBadge.textContent = "✓ 答對了";
      } else {
        statusBadge.className =
          "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-800 dark:bg-rose-900/50 dark:text-rose-300";
        statusBadge.textContent = "✕ 再想想";
      }

      header.appendChild(leftMeta);
      header.appendChild(statusBadge);

      // 題幹文字
      const questionTitle = document.createElement("h3");
      questionTitle.className = "text-base sm:text-lg font-bold leading-relaxed text-slate-900 dark:text-white";
      questionTitle.textContent = promptText;

      // 選項列表
      const optionsBox = document.createElement("div");
      optionsBox.className = "grid grid-cols-1 gap-2.5";

      const labels = ["A", "B", "C", "D"];
      options.forEach((optText, optIdx) => {
        const isSelected = userAnswer === optText;
        const isThisCorrect = optText === q.correct;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className =
          "option-card w-full text-left p-3.5 sm:p-4 rounded-xl border flex items-start gap-3 cursor-pointer ";

        if (!hasAnswered) {
          btn.className +=
            "border-slate-200 dark:border-slate-700 bg-slate-50/70 dark:bg-slate-800/50 hover:border-amber-400 hover:bg-amber-50/70 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-100";
        } else if (isThisCorrect) {
          btn.className +=
            "border-emerald-500 bg-emerald-50/90 dark:bg-emerald-950/50 text-emerald-950 dark:text-emerald-100 ring-1 ring-emerald-500";
        } else if (isSelected && !isThisCorrect) {
          btn.className +=
            "border-rose-500 bg-rose-50/90 dark:bg-rose-950/50 text-rose-950 dark:text-rose-100 ring-1 ring-rose-500";
        } else {
          btn.className +=
            "border-slate-200/70 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400 opacity-75";
        }

        const keyBadge = document.createElement("span");
        keyBadge.className =
          "inline-flex items-center justify-center w-6 h-6 rounded-lg text-xs font-bold shrink-0 mt-0.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200";
        keyBadge.textContent = labels[optIdx] || String(optIdx + 1);

        const textSpan = document.createElement("span");
        textSpan.className = "text-sm sm:text-base leading-snug font-medium";
        textSpan.textContent = optText;

        btn.appendChild(keyBadge);
        btn.appendChild(textSpan);

        btn.addEventListener("click", () => {
          selectAnswer(q.id, optText);
        });

        optionsBox.appendChild(btn);
      });

      card.appendChild(header);
      card.appendChild(questionTitle);
      card.appendChild(optionsBox);

      // 作答後顯示解析
      if (hasAnswered) {
        const expBox = document.createElement("div");
        expBox.className =
          "rounded-xl bg-amber-50/90 dark:bg-slate-800/80 border border-amber-200/80 dark:border-slate-700 p-3.5 text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed";

        const expStrong = document.createElement("span");
        expStrong.className = "font-bold text-amber-800 dark:text-amber-300 mr-1.5";
        expStrong.textContent = "觀念解析：";

        const expContent = document.createElement("span");
        expContent.textContent = q.explanation;

        expBox.appendChild(expStrong);
        expBox.appendChild(expContent);
        card.appendChild(expBox);
      }

      return card;
    }

    function renderSingleQuestion(questionId) {
      const index = QUESTION_BANK.findIndex((item) => item.id === questionId);
      if (index === -1) return;
      const q = QUESTION_BANK[index];
      const existing = document.getElementById(`q-card-${questionId}`);
      if (existing) {
        const fresh = buildQuestionCard(q, index);
        existing.replaceWith(fresh);
      }
    }

    function renderAll() {
      const container = document.getElementById("quizContainer");
      container.innerHTML = "";

      const filteredItems = QUESTION_BANK.map((q, idx) => ({ q, idx })).filter(({ q }) => {
        const chosen = state.answers[q.id];
        if (state.filter === "unanswered") return chosen === undefined;
        if (state.filter === "wrong") return chosen !== undefined && chosen !== q.correct;
        return true;
      });

      if (filteredItems.length === 0) {
        const empty = document.createElement("div");
        empty.className =
          "rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 text-center space-y-2";
        empty.innerHTML = `
          <p class="text-base font-bold text-slate-800 dark:text-slate-100">目前此篩選條件下沒有題目</p>
          <p class="text-sm text-slate-500 dark:text-slate-400">可以切換回「全部題目」，或點擊「重新測驗」展開新的一輪。</p>
        `;
        container.appendChild(empty);
      } else {
        filteredItems.forEach(({ q, idx }) => {
          container.appendChild(buildQuestionCard(q, idx));
        });
      }

      updateStats();
    }

    function updateFilterButtonsUI() {
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        const isActive = btn.dataset.filter === state.filter;
        btn.className = isActive
          ? "filter-btn px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium bg-slate-900 text-white dark:bg-amber-500 dark:text-slate-950 cursor-pointer"
          : "filter-btn px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 cursor-pointer";
      });
    }

    // 綁定事件
    document.getElementById("btnRetakeTop").addEventListener("click", () => retakeQuiz(null));
    document.getElementById("btnRetakeBottom").addEventListener("click", () => retakeQuiz(null));
    document.getElementById("btnRetakeSummary").addEventListener("click", () => retakeQuiz(null));
    document.getElementById("btnShowSummary").addEventListener("click", () => showSummary(false));

    document.getElementById("modeSelect").addEventListener("change", (e) => {
      state.modeIndex = Number(e.target.value) || 0;
      renderAll();
    });

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.filter = btn.dataset.filter;
        updateFilterButtonsUI();
        renderAll();
      });
    });

    document.getElementById("btnThemeToggle").addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
    });

    // 初始化
    prepareOptionsForRound();
    renderAll();
  </script>
</body>
</html>
